<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="日本大学生産工学部 津田沼キャンパス 37号館・39号館の教室使用状況(1限〜6限)をフロアマップで表示します。">
  <title>37・39号館 教室マップ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>37・39号館 教室マップ</h1>
    <p class="sub">令和8年度 学部時間割より ・ 津田沼キャンパス</p>
  </header>

  <section class="controls" aria-label="表示条件">
    <div class="row">
      <span class="lbl">学期</span>
      <div class="seg" id="seg-q" role="radiogroup" aria-label="クォーター"></div>
    </div>
    <div class="row">
      <span class="lbl">曜日</span>
      <div class="seg" id="seg-d" role="radiogroup" aria-label="曜日"></div>
    </div>
    <div class="row">
      <span class="lbl">時限</span>
      <div class="seg seg-period" id="seg-p" role="radiogroup" aria-label="時限"></div>
    </div>
    <div class="row row-tools">
      <div class="tabs" id="tabs-b" role="tablist" aria-label="建物"></div>
      <button type="button" class="btn-now" id="btn-now">いま</button>
    </div>
  </section>

  <main>
    <div class="summary" id="summary" aria-live="polite"></div>
    <div class="legend">
      <span><i class="sw sw-free"></i>空き</span>
      <span><i class="sw sw-used"></i>授業あり</span>
      <span><i class="sw sw-none"></i>時間割に登録なし</span>
    </div>
    <div class="viewtabs" role="tablist" aria-label="表示切替">
      <button type="button" role="tab" data-view="map" aria-selected="true">フロアマップ</button>
      <button type="button" role="tab" data-view="table" aria-selected="false">1〜6限 一覧</button>
    </div>
    <div id="view-map" class="floors"></div>
    <div id="view-table" class="tablewrap" hidden></div>

    <p class="note">
      フロア図は第35回桜泉祭デジタルパンフレットの校内図を参考に作成した模式図です。「推定」と書かれた階はパンフレットに図がなく、配置を推定しています。<br>
      集中講義・時限「その他」の授業は含みません。時刻は目安です。最新の情報は大学の公式発表を確認してください。
    </p>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="閉じる">×</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
